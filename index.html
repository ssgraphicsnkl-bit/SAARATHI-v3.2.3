<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAARATHI — Smart Business Assistant</title><style>
:root{--navy:#101e37;--blue:#172b4d;--orange:#ff9016;--bg:#f4f6fb;--ink:#1d2d4b;--line:#e3e8f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px 'Segoe UI',Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}#shell{display:grid;grid-template-columns:255px 1fr;min-height:100vh}aside{background:var(--navy);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:7px 9px 20px;border-bottom:1px solid #ffffff24}.brand img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:14px}.brand strong{font-size:21px;letter-spacing:1px}.brand small{display:block;color:#c5d0e4;font-size:10px;margin-top:3px}.company{padding:19px 9px;border-bottom:1px solid #ffffff22}.company label{font-size:10px;color:#9babc5;letter-spacing:1px}.company select{background:#263957;color:white;border:1px solid #536582;border-radius:8px;padding:10px;width:100%;margin-top:9px}.company button{border:0;background:transparent;color:#ffba5f;margin-top:9px;padding:3px}nav{padding:12px 0}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d6e0f2;padding:12px 13px;border-radius:8px;margin:2px 0}nav button.active,nav button:hover{background:#2a426b;color:#fff}nav .section{font-size:10px;color:#8499bd;padding:17px 11px 5px;letter-spacing:1.3px}main{min-width:0}header{background:white;display:flex;justify-content:space-between;align-items:center;padding:17px 26px;border-bottom:1px solid var(--line);gap:10px}header h1{margin:0;font-size:23px}header small{color:#8b96a9}header .right{display:flex;align-items:center;gap:12px}#content{padding:24px;max-width:1550px;margin:auto}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 15px;border-radius:9px;font-weight:600}.primary{background:var(--orange);border-color:var(--orange);color:#1b2437}.danger{background:#fff0f0;color:#9f2330;border-color:#ffced1}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.panel{border:1px solid var(--line);background:#fff;border-radius:14px;padding:19px;margin-bottom:18px;box-shadow:0 2px 8px #20305509}.metric small{color:#8290a4}.metric h2{margin:9px 0 0;font-size:25px}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:17px}.bar h2{margin:0;font-size:19px}.muted{color:#8793a6}.flex{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;min-width:130px;flex:1}.field label{font-size:12px;color:#63718a;font-weight:600}.field input,.field select,.field textarea,select.ctrl,input.ctrl{padding:10px 11px;border:1px solid #dce2ed;border-radius:9px;min-width:0;background:#fff;width:100%}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{background:#f4f7fc;color:#687790;text-align:left;font-size:12px;font-weight:700}td,th{padding:12px;border-bottom:1px solid #edf0f5}tr:last-child td{border-bottom:0}.pos{display:grid;grid-template-columns:minmax(0,1fr) 345px;gap:17px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.product{border:1px solid var(--line);border-radius:12px;background:white;text-align:left;padding:10px;transition:.1s}.product:hover{border-color:#ffb651;transform:translateY(-1px)}.product img{width:100%;aspect-ratio:1.45;object-fit:contain;border-radius:8px;background:#f5f7fb}.placeholder{aspect-ratio:1.45;display:grid;place-items:center;background:#f8f3e8;border-radius:8px;font-size:35px}.product b{display:block;margin:9px 0 4px}.product small{color:#677590}.total{border-top:2px solid var(--line);padding-top:15px;font-size:22px;font-weight:800}.pill{background:#edf4ff;border-radius:20px;padding:4px 9px;font-size:11px;color:#2860a3}.note{background:#fff7e9;border:1px solid #ffe4bb;border-radius:10px;padding:12px;color:#8d5a17}.empty{padding:35px;text-align:center;color:#93a0b1}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}#toast{position:fixed;right:22px;bottom:20px;background:#172b4d;color:#fff;padding:14px 22px;border-radius:10px;box-shadow:0 10px 28px #0004;display:none;z-index:5}.modalcover{position:fixed;inset:0;background:#07152ca8;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modal{background:#fff;border-radius:16px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:24px}.modal h2{margin-top:0} .quantity{width:63px!important}.links{display:flex;gap:8px;flex-wrap:wrap} .chartrow{display:flex;align-items:center;gap:12px;margin:9px 0}.chartrow span{width:110px}.chartrow .track{height:14px;flex:1;background:#edf1f8;border-radius:20px;overflow:hidden}.chartrow .fill{height:100%;background:linear-gradient(90deg,#ff9c22,#ffc341)}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.pos{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){#shell{grid-template-columns:1fr}aside{position:relative;height:auto}nav{display:grid;grid-template-columns:repeat(2,1fr)}nav .section{grid-column:span 2}.company{padding:10px}#content{padding:12px}.grid,.twocol,.form-grid{grid-template-columns:1fr}header{padding:12px}.product img{max-height:120px}}@media print{aside,header,.noprint{display:none!important}#shell{display:block}#content{padding:0}.panel{border:0;box-shadow:none}}

/* v2 dashboard, category accordion and moveable dialogs */
.modal{position:relative}.modal .bar:first-child{cursor:move;user-select:none;touch-action:none}.modal .bar:first-child button{cursor:pointer}.modalcover{align-items:flex-start;padding-top:5vh}.modal{resize:both;min-width:min(340px,95vw);max-width:96vw;min-height:180px;box-shadow:0 20px 60px #06173555}.side-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.right-stack .panel{margin-bottom:12px}.dashboard-hidden{min-height:350px;border-radius:14px;background:#eef1f6;display:grid;place-items:center;color:#6f7e95;font-size:20px}.dropdown-suggest{position:relative}.suggest-list{position:absolute;z-index:12;top:100%;left:0;right:0;max-height:185px;overflow:auto;background:white;border:1px solid #dce2ed;border-radius:9px;box-shadow:0 10px 30px #0002}.suggest-list button{display:block;width:100%;border:0;background:white;text-align:left;padding:10px}.suggest-list button:hover{background:#fff2dc}.stock-low{color:#b55d00;font-weight:700}.stock-out{color:#b82b35;font-weight:700}.three-dot{font-size:24px;line-height:1}.privacy-menu{position:absolute;right:0;top:42px;background:#fff;padding:15px;border:1px solid var(--line);box-shadow:0 9px 30px #0002;border-radius:12px;z-index:3;min-width:190px}.category-group{border:1px solid var(--line);background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden}.category-head{width:100%;border:0;background:#f8f9fc;padding:15px 18px;text-align:left;font-weight:700;display:flex;justify-content:space-between;align-items:center}.category-content{padding:10px}.mini-chip{border-radius:8px;background:#eef3fa;padding:7px 10px}.invoice-theme{display:inline-flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}.theme-swatch{width:25px;height:25px;border-radius:6px}.suggest-list:empty{display:none}@media(max-width:1200px){.side-layout{grid-template-columns:1fr}.right-stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}@media(max-width:700px){.right-stack{grid-template-columns:1fr}}

/* SAARATHI v2.2.4: grouped navigation & native-themed exit overlay */
nav .nav-group-title{width:100%;padding:14px 12px 11px;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;color:#b7c8e7;font-size:11px;font-weight:800;letter-spacing:1.2px;text-align:left;border-top:1px solid #ffffff1b;margin-top:8px}
nav .nav-group-title:hover{background:#223655;color:#fff}nav .nav-group-body{padding:0 3px 7px}nav .nav-group-body button{padding:10px 12px}nav .nav-exit-btn{border-top:1px solid #ffffff22;margin-top:20px;color:#ffcf73;font-weight:700}
.saarathi-exit-backdrop{position:fixed;inset:0;background:#0b1832b8;display:flex;align-items:center;justify-content:center;z-index:20000;padding:18px}
.saarathi-exit-backdrop[hidden]{display:none!important}
.saarathi-exit-card{width:min(100%,440px);border-radius:20px;background:linear-gradient(145deg,#132951,#101c37);border:1px solid #6e90c84f;box-shadow:0 35px 100px #06122b80;padding:27px;color:#fff}
.saarathi-exit-head{display:flex;gap:15px;align-items:center}.saarathi-exit-icon{border-radius:14px;background:#2a4675;color:#ffc24f;font-size:26px;width:52px;height:52px;display:grid;place-items:center}.saarathi-exit-head h2{color:#fff;font-size:22px;margin:0 0 4px}.saarathi-exit-head small{color:#b7c8e7}.saarathi-exit-card p{margin:21px 0 0;line-height:1.55;font-size:16px}.saarathi-exit-card p.saarathi-exit-note{margin-top:9px;color:#c4d1e5;font-size:13px}.saarathi-exit-actions{margin-top:27px;display:flex;gap:10px}.saarathi-exit-actions button{flex:1;border:0;padding:13px 10px;border-radius:11px;font-weight:800}.saarathi-stay{background:#314b75;color:white}.saarathi-leave{background:#f4b733;color:#13213d}
/* AI Poster Studio: responsive, lightweight, no external AI keys */
.poster-card{background:#fff;border:1px solid #e3e9f5;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #15284909}
.poster-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.poster-studio input,.poster-studio textarea,.poster-studio select,.poster-settings input{width:100%;max-width:100%;border:1px solid #d6dfed;border-radius:9px;padding:11px;background:#fff;color:#24334f}
.poster-studio label,.poster-settings label{display:block;font-weight:600;margin-bottom:6px;font-size:13px}
.poster-studio .hint{font-size:12px;color:#64748b;line-height:1.6;margin:7px 0}
.poster-studio .poster-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}
.poster-studio .poster-actions button{min-height:40px}
.poster-studio textarea{resize:vertical;line-height:1.55}
.poster-brand-logo{width:98px;height:98px;object-fit:contain;border-radius:13px;background:#fff;border:1px solid #dbe4f2;padding:8px}
.poster-studio .brand-info{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.poster-studio .tag{display:inline-block;background:#e7f5eb;color:#126437;border-radius:20px;padding:4px 10px;font-size:12px}
@media(max-width:700px){.poster-grid{grid-template-columns:1fr}.poster-card{padding:14px}}


/* SAARATHI date range picker: Vyapar-style, live apply, no Apply button. */
.sa-range-root{position:relative;display:inline-flex;flex-direction:column;gap:8px;max-width:100%;min-width:300px}
.sa-range-fields{display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.sa-range-field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#677590;font-weight:650}
.sa-range-field .ctrl{min-width:142px;max-width:175px;background:#fff}
.sa-calendar-trigger{border:1px solid #cfdbed;background:#edf4ff;color:#163d7a;border-radius:10px;padding:9px 12px;white-space:nowrap;font-weight:650}
.sa-calendar-trigger:hover,.sa-calendar-trigger:focus{background:#dbeaff}
.sa-calendar-popup{position:absolute;top:calc(100% + 7px);left:0;width:min(356px,calc(100vw - 42px));padding:15px;background:#fff;border:1px solid #d8e0ef;border-radius:15px;box-shadow:0 18px 48px #142a4a33;z-index:1050}
.sa-calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sa-calendar-head strong{font-size:16px;color:#182d53}
.sa-calendar-arrow{border:0;border-radius:7px;color:#1e5eb4;background:#eff5fe;font-size:19px;width:30px;height:30px}
.sa-calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.sa-weekday{font-size:11px;font-weight:750;color:#7b8799;padding:6px 0}
.sa-calendar-day{min-height:36px;border:1px solid transparent;border-radius:9px;background:#fff;color:#243655;font-size:13px;padding:3px;cursor:pointer;user-select:none}
.sa-calendar-day:hover{background:#e6efff;border-color:#c9dcff}
.sa-calendar-day.sa-today{border:2px solid #2563eb;font-weight:800}
.sa-calendar-day.sa-selected{background:#2563eb;color:#fff}
.sa-calendar-day.sa-selected.sa-today{border-color:#0d328a}
.sa-calendar-day.sa-between{background:#e7f0ff;border-radius:5px}
.sa-calendar-empty{height:36px}
.sa-calendar-note{font-size:11px;color:#69768b;margin:12px 0 4px;line-height:1.45}
.sa-range-prompt{font-size:12px;color:#234e92;font-weight:700;margin-top:6px}
@media(max-width:520px){.sa-range-root{min-width:0;width:100%}.sa-range-fields{gap:7px}.sa-range-field .ctrl{min-width:0;max-width:135px}.sa-calendar-popup{left:0}}

/* SAARATHI v3.2.0: custom in-app alerts, confirmations and text requests */
#sa-app-dialog-host{position:fixed;inset:0;z-index:2147483646;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(9,20,43,.64);backdrop-filter:blur(3px)}
#sa-app-dialog-host[hidden]{display:none!important}
.sa-app-dialog{width:min(470px,100%);background:#fff;border-radius:19px;border:1px solid #dce5f3;box-shadow:0 28px 90px #07173575;overflow:hidden;color:#20314f;font-family:'Segoe UI',Arial,sans-serif}
.sa-app-dialog-head{background:linear-gradient(120deg,#10234b,#1a3f70);padding:19px 22px;color:#fff;display:flex;align-items:center;gap:13px}
.sa-app-dialog-icon{width:42px;height:42px;background:#ffffff22;border:1px solid #ffffff33;border-radius:12px;display:grid;place-items:center;font-size:23px;flex:none}
.sa-app-dialog-head strong{font-size:18px;letter-spacing:.2px}.sa-app-dialog-head small{display:block;color:#c6d6f1;font-size:11px;margin-top:3px;letter-spacing:.6px}
.sa-app-dialog-message{white-space:pre-wrap;overflow-wrap:anywhere;max-height:42vh;overflow:auto;padding:22px 23px 10px;font-size:14px;line-height:1.65}
.sa-app-dialog-input{display:block;width:calc(100% - 46px);margin:4px 23px 9px;padding:12px;border:1px solid #b8c7de;border-radius:9px;outline:none;color:#142846}
.sa-app-dialog-input:focus{border-color:#ff9016;box-shadow:0 0 0 3px #ff901626}
.sa-app-dialog-actions{display:flex;justify-content:flex-end;gap:10px;padding:17px 23px 23px;flex-wrap:wrap}
.sa-app-dialog-actions button{border-radius:10px;border:1px solid #d6dfee;padding:10px 20px;font-weight:700;min-width:91px;cursor:pointer}
.sa-app-dialog-cancel{background:#f3f6fb;color:#304461}.sa-app-dialog-accept{background:#ff9016;color:#fff;border-color:#ff9016!important}
.sa-app-dialog-accept:focus-visible,.sa-app-dialog-cancel:focus-visible{outline:3px solid #ffd182;outline-offset:2px}

/* SAARATHI attendance choices — v3.2.1 */
.att-choice{display:flex;gap:13px;align-items:center;border:1px solid #dde5f0;border-radius:12px;padding:15px;cursor:pointer;background:#f9fbff}
.att-choice:has(input:checked){border-color:#ff9016;background:#fff6e9}
.att-choice input{width:19px;height:19px;accent-color:#ff9016}
.att-choice span{display:grid;gap:4px}.att-choice small{font-size:12px;color:#77859b}
.att-permission-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.att-permission-fields .field:first-child{grid-column:1/-1}
.att-permission-fields input{padding:11px;border:1px solid #dbe2ef;border-radius:9px;width:100%;min-width:0}
.att-status-actions{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}

/* Native browser dialogs are deliberately not used in SAARATHI UI. */
const saDialogQueue=[];
let saDialogOpen=false;
function saModalRequest(kind,message,defaultValue=''){
  return new Promise(resolve=>{
    saDialogQueue.push({kind,message:String(message??''),defaultValue:String(defaultValue??''),resolve});
    saProcessDialog();
  });
}
function saProcessDialog(){
  if(saDialogOpen||!saDialogQueue.length)return;
  const d=saDialogQueue[0];saDialogOpen=true;
  let host=document.getElementById('sa-app-dialog-host');
  if(!host){host=document.createElement('div');host.id='sa-app-dialog-host';document.body.appendChild(host)}
  const title=d.kind==='confirm'?'Confirm Action':d.kind==='prompt'?'Verification Required':'SAARATHI Notice';
  const icon=d.kind==='confirm'?'?':d.kind==='prompt'?'✎':'i';
  host.hidden=false;
  host.innerHTML='<div class="sa-app-dialog" role="dialog" aria-modal="true" aria-labelledby="sa-app-dialog-title">'+
    '<div class="sa-app-dialog-head"><div class="sa-app-dialog-icon">'+icon+'</div><div><strong id="sa-app-dialog-title">'+title+'</strong><small>Your Smart Business Assistant</small></div></div>'+
    '<div class="sa-app-dialog-message"></div>'+
    (d.kind==='prompt'?'<input class="sa-app-dialog-input" type="text" autocomplete="off" aria-label="Confirmation text">':'')+
    '<div class="sa-app-dialog-actions">'+
    (d.kind==='alert'?'':'<button type="button" class="sa-app-dialog-cancel">Cancel</button>')+
    '<button type="button" class="sa-app-dialog-accept">'+(d.kind==='alert'?'OK':'Confirm')+'</button></div></div>';
  host.querySelector('.sa-app-dialog-message').textContent=d.message;
  const input=host.querySelector('.sa-app-dialog-input');if(input)input.value=d.defaultValue;
  const finish=accepted=>{
    if(!saDialogOpen)return;
    host.removeEventListener('keydown',onKey);
    host.hidden=true;host.innerHTML='';saDialogQueue.shift();saDialogOpen=false;
    d.resolve(d.kind==='alert'?undefined:d.kind==='confirm'?accepted:(accepted?(input?.value??''):null));
    saProcessDialog();
  };
  function onKey(e){if(e.key==='Escape'&&d.kind!=='alert'){e.preventDefault();finish(false)}else if(e.key==='Enter'){e.preventDefault();finish(true)}}
  host.addEventListener('keydown',onKey);
  host.querySelector('.sa-app-dialog-accept').addEventListener('click',()=>finish(true));
  host.querySelector('.sa-app-dialog-cancel')?.addEventListener('click',()=>finish(false));
  (input||host.querySelector('.sa-app-dialog-accept')).focus();
}
function saNotice(message){return saModalRequest('alert',message)}
function saConfirm(message){return saModalRequest('confirm',message)}
function saPrompt(message,defaultValue=''){return saModalRequest('prompt',message,defaultValue)}
/* Preserve synchronous return behavior of existing validation call sites. */
function alert(message){void saNotice(message)}

function dateWithin(date,from,to){return (!from||String(date)>=from)&&(!to||String(date)<=to)}
function normCategory(v){return String(v||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase()}
function canonicalCategory(name){const value=String(name||'').trim().replace(/\s+/g,' ');return mine(db.items).find(x=>normCategory(x.category)===normCategory(value))?.category||value}
function categoriesForCompany(){const all=new Map();for(const item of mine(db.items)){const key=normCategory(item.category);if(key&&!all.has(key))all.set(key,item.category.trim())}return [...all.values()].sort((a,b)=>a.localeCompare(b))}

const saCalendarState={};
function saLocalDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateRangeMarkup(prefix,from,to){
 return `<div class="sa-range-root" id="${prefix}RangeRoot"><div class="sa-range-fields">
 <button type="button" class="sa-calendar-trigger" onclick="saToggleCalendar('${prefix}')">📅 Select dates</button>
 <label class="sa-range-field">From<input class="ctrl" id="${prefix}From" type="date" value="${E(from)}" onchange="applyRange('${prefix}')"></label>
 <label class="sa-range-field">To<input class="ctrl" id="${prefix}To" type="date" value="${E(to)}" onchange="applyRange('${prefix}')"></label>
 </div><div class="sa-calendar-popup" id="${prefix}Calendar" hidden></div></div>`;
}
function saToggleCalendar(prefix){
 const el=document.getElementById(prefix+'Calendar');if(!el)return;
 const opening=el.hidden;
 document.querySelectorAll('.sa-calendar-popup').forEach(p=>p.hidden=true);
 if(!opening)return;
 const from=document.getElementById(prefix+'From')?.value;
 const ref=from&&/^\d{4}-\d{2}-\d{2}$/.test(from)?from:today();
 if(!saCalendarState[prefix])saCalendarState[prefix]={year:Number(ref.slice(0,4)),month:Number(ref.slice(5,7))-1,stage:0};
 saCalendarState[prefix].stage=0;el.hidden=false;saDrawCalendar(prefix);
}
function saShiftMonth(prefix,delta){
 const state=saCalendarState[prefix];if(!state)return;
 const date=new Date(state.year,state.month+delta,1);
 state.year=date.getFullYear();state.month=date.getMonth();saDrawCalendar(prefix);
}
function saDrawCalendar(prefix){
 const el=document.getElementById(prefix+'Calendar'),s=saCalendarState[prefix];if(!el||!s)return;
 const from=document.getElementById(prefix+'From')?.value||'',to=document.getElementById(prefix+'To')?.value||'';
 const name=new Date(s.year,s.month,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
 const offset=new Date(s.year,s.month,1).getDay();
 const count=new Date(s.year,s.month+1,0).getDate();
 const weekdays=['Su','Mo','Tu','We','Th','Fr','Sa'];
 let dates=Array.from({length:offset},()=>'<div class="sa-calendar-empty"></div>').join('');
 for(let day=1;day<=count;day++){
  const val=s.year+'-'+String(s.month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  const cls=['sa-calendar-day',val===today()?'sa-today':'',val===from||val===to?'sa-selected':'',from&&to&&val>from&&val<to?'sa-between':''].filter(Boolean).join(' ');
  dates+=`<button type="button" class="${cls}" title="Double-click to select ${val}" ondblclick="saPickCalendarDate('${prefix}','${val}')">${day}</button>`;
 }
 const prompt=s.stage===0?'Double-click a date to select From':'Now double-click a date to select To';
 el.innerHTML=`<div class="sa-calendar-head"><button type="button" class="sa-calendar-arrow" onclick="saShiftMonth('${prefix}',-1)">‹</button><strong>${name}</strong><button type="button" class="sa-calendar-arrow" onclick="saShiftMonth('${prefix}',1)">›</button></div><div class="sa-calendar-grid">${weekdays.map(x=>`<div class="sa-weekday">${x}</div>`).join('')}${dates}</div><div class="sa-range-prompt">${prompt}</div><div class="sa-calendar-note">Today is outlined in blue. The filter updates automatically after the second date.</div>`;
}
function saPickCalendarDate(prefix,value){
 const state=saCalendarState[prefix];if(!state)return;
 const fromEl=document.getElementById(prefix+'From'),toEl=document.getElementById(prefix+'To');
 if(!fromEl||!toEl)return;
 if(state.stage===0){fromEl.value=value;toEl.value='';state.stage=1;saDrawCalendar(prefix);return;}
 // Support selecting dates in either order, including a one-day range.
 let from=fromEl.value,to=value;
 if(to<from)[from,to]=[to,from];
 fromEl.value=from;toEl.value=to;state.stage=0;
 applyRange(prefix);
}
function applyRange(prefix){
 const from=q('#'+prefix+'From')?.value||'',to=q('#'+prefix+'To')?.value||'';
 if(from&&to&&from>to){alert('From Date must not be after To Date');return;}
 if(prefix==='dashboard'){dashboardFrom=from;dashboardTo=to}
 else if(prefix==='invoice'){invoiceFrom=from;invoiceTo=to}
 else if(prefix==='report'){reportFrom=from;reportTo=to}
 else return;
 render();
}

function rangePreset(kind){const d=new Date(),start=new Date(d);if(kind==='week')start.setDate(d.getDate()-((d.getDay()+6)%7));else if(kind==='month')start.setDate(1);else if(kind==='quarter'){start.setMonth(Math.floor(d.getMonth()/3)*3,1)}else if(kind==='half'){start.setMonth(d.getMonth()<6?0:6,1)}else start.setMonth(0,1);const fmt=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');return [fmt(start),today()]}

function setAttendanceHistoryFilter(key,value){
 if(key==='staff')attendanceHistoryStaff=String(value);

 if(key==='from'){attendanceHistoryFrom=String(value||'');attendanceHistoryPeriod='custom'}

 // Attendance records remain unchanged; these values are display filters only.

function attendancePeriodBounds(period,now=new Date()){
 const localISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 const end=localISO(now);
 if(period==='today')return [end,end];
 if(period==='week'){
   const monday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
   monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
   return [localISO(monday),end];
 }
 if(period==='month')return [localISO(new Date(now.getFullYear(),now.getMonth(),1)),end];
 return ['',''];
}
function filteredAttendanceRecords(){
 const [from,to]=attendanceHistoryPeriod==='custom'?[attendanceHistoryFrom,attendanceHistoryTo]:attendancePeriodBounds(attendanceHistoryPeriod);
 if(from&&to&&from>to)return [];
 const chosen=attendanceHistoryStaff;
 const selected=staffForCompany().find(x=>String(x.id)===chosen);
 return mine(db.attendance).filter(r=>{
   if(from&&String(r.date||'')<from)return false;
   if(to&&String(r.date||'')>to)return false;
   if(chosen!=='all'){
     if(!selected)return false;
     if(String(r.staffId||'')!==String(selected.id)&&String(r.name||'').trim().toLocaleLowerCase()!==String(selected.name).trim().toLocaleLowerCase())return false;
   }
   return true;
 });
}
function attendanceSummary(rows){
 let present=0,half=0,absent=0,permissionCount=0,permissionHours=0,paidDays=0;
 // A permission is an annotation on a present day, never a separate unpaid attendance status.
 for(const r of rows){
  const status=String(r.status||'').trim().toLowerCase();
  if(['present','full day','full day present','permission'].includes(status)){present++;paidDays+=1;}
  else if(status==='half day'){half++;paidDays+=0.5;}
  else if(status==='absent')absent++;
  if(attendanceHasPermission(r)){permissionCount++;permissionHours+=Number(r.permissionHours)||0;}
 }
 return {present,half,absent,permissionCount,permissionHours,paidDays};
}
function payrollPreview(staff,month){
 if(!staff||!/^\d{4}-\d{2}$/.test(month))return null;
 const salary=Number(staff.monthlySalary),days=Number(staff.payableDays);
 if(!(salary>0&&days>0&&days<=31))return null;
 const monthRows=mine(db.attendance).filter(r=>String(r.date||'').startsWith(month+'-')&&(String(r.staffId)===String(staff.id)||String(r.name||'').trim().toLowerCase()===String(staff.name).trim().toLowerCase()));
 const summary=attendanceSummary(monthRows);
 const credited=Math.min(days,summary.paidDays);
 return {salary,days,credited,estimated:Math.round(salary*credited/days*100)/100,unmarkedNote:'Only explicitly recorded days are counted. This is not a finalized payslip.'};
}

function timeToMinutes(v){if(!/^\d{2}:\d{2}$/.test(String(v)))return NaN;const [h,m]=v.split(':').map(Number);return h*60+m}

function changeAttendanceStatus(recordId){const r=mine(db.attendance).find(x=>x.id===recordId);if(!r)return;if(r.date!==today())return alert('Previous dates cannot be edited');let staff=attendanceStaff(r.staffId);if(!staff)staff=staffForCompany().find(s=>s.name.toLowerCase()===String(r.name||'').toLowerCase());if(!staff)return alert('Staff not found');attendanceActionModal('Change Attendance Status',`<p class="muted">Select a new status for ${E(r.name)}.</p><div class="att-status-actions"><button class="btn primary" type="button" data-choice="full">✓ Full Day</button><button class="btn" type="button" data-choice="half">◐ Half Day</button><button class="btn" type="button" data-choice="permission">⏱ Permission</button></div>`,staff.id,()=>{});document.querySelectorAll('.saarathi-att-action [data-choice]').forEach(b=>b.onclick=()=>{const choice=b.dataset.choice;document.querySelector('.saarathi-att-action')?.remove();if(choice==='full')setAttendanceFullDay(staff.id);if(choice==='half')showAttendanceHalfDay(staff.id);if(choice==='permission')showAttendancePermission(staff.id)})}
function exportAttendanceCSV(){
 const rows=filteredAttendanceRecords();
 if(!rows.length)return toast('No attendance records for selected filters');
 const columns=['Date','Time','Staff','Status','Half Day Session','Permission Hours','From Time','To Time'];
 const csv='\ufeff'+[columns.join(','),...rows.map(x=>[x.date,x.time,x.name,attendanceDisplayStatus(x),x.halfSession==='AM'?'Forenoon':x.halfSession==='PM'?'Afternoon':'',x.permissionHours||'',x.permissionFrom||'',x.permissionTo||''].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');
 download('attendance-'+(attendanceHistoryStaff==='all'?'all-staff':attendanceHistoryStaff)+'-'+attendanceHistoryPeriod+'-'+today()+'.csv',csv,'text/csv');
}
function chooseCompanyLogo(){q('#companyLogoInput')?.click()}

function freshCustomer(){const name=q('#newBillName').value.trim(),phone=q('#newBillPhone').value.replace(/\D/g,'');if(!name&&!phone)return null;if(!name)return alert('Enter customer name');if(phone&&phone.length!==10)return alert('Use a valid 10-digit phone');let c=mine(db.clients).find(x=>phone&&x.phone.replace(/\D/g,'')===phone);if(!c){c={id:id(),company,name,phone,address:'',points:0};db.clients.push(c)}return c.id}
function selectedBillCustomer(){let id=Number(q('#billClient').value)||null;if(id)return id;let result=freshCustomer();if(result===undefined)return undefined;return result}
function billCustomerChanged(){const id=Number(q('#billClient').value);let c=mine(db.clients).find(x=>x.id===id);q('#newBillName').value=c?.name||'';q('#newBillPhone').value=c?.phone||'';q('#newBillName').disabled=!!c;q('#newBillPhone').disabled=!!c}
function whatsappPhone(){return String(co().whatsapp||co().phone||'').replace(/\D/g,'')}

async function customerWhatsApp(id){const s=mine(db.sales).find(x=>x.id===id);if(!s)return;const company=co(),message=`${company.name}\nInvoice: ${s.invoiceNo}\nCustomer: ${s.customerName||'Unknown'}\nTotal: ${money(s.total)}\n${company.reviewEnabled===false?'':(company.reviewMessage||'Please review our shop!')+'\n'+(company.googleReviewUrl||'')}`;try{await navigator.clipboard.writeText(message);toast('Bill summary & review link copied. Choose customer in WhatsApp, paste and attach PNG/PDF.')}catch{await saPrompt('Copy the message to WhatsApp:',message)}openLink('https://web.whatsapp.com/')}

function download(name,data,type='application/json'){const u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}function backup(){
 if(!requireOwner())return;
 let data=db;
 if(window.saarathiDesktop?.portableState){const result=window.saarathiDesktop.portableState();if(!result.ok)return alert('Could not export complete backup: '+result.error);data=result.data||db}
 download('saarathi-backup-'+today()+'.json',JSON.stringify(data,null,2));
}
function makeNativeBackup(){if(!requireOwner())return;if(!window.saarathiDesktop?.backupNow)return alert('Windows desktop only.');const result=window.saarathiDesktop.backupNow();alert(result.ok?'Backup created: '+result.path:'Backup failed: '+result.error)}
function showDataLocation(){if(!requireOwner())return;if(!window.saarathiDesktop?.dataInfo)return alert('Browser preview: Data is stored in browser localStorage, not SQLite.');const p=window.saarathiDesktop.dataInfo();alert('SAARATHI LOCAL STORAGE\n\nSQLite: '+p.dbPath+'\nImages: '+p.images+'\nBackups: '+p.backups)}
function restore(input){if(!requireOwner())return;let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=async ()=>{try{let val=JSON.parse(reader.result);if(!val||!Array.isArray(val.companies)||!Array.isArray(val.items)||!Array.isArray(val.sales)||!Number.isSafeInteger(Number(val.seq))||Number(val.seq)<1)throw Error('Invalid backup: required data or sequence missing');if(!await saConfirm('Replace ALL current data with this backup?'))return;const beforeRestore=structuredClone(db),beforeUser=loggedUser,beforeCompany=company;db={...structuredClone(seed),...val};db.users=Array.isArray(db.users)?db.users:[];db.quotations=Array.isArray(db.quotations)?db.quotations:[];if(!save()){db=beforeRestore;loggedUser=beforeUser;company=beforeCompany;return}loggedUser=null;company=db.companies[0]?.id||null;render();toast('Backup restored')}catch(e){alert('Restore failed: '+e.message)}};reader.readAsText(file)}function backupView(){return `<div class="panel"><h2>Local Backup & Restore</h2><p>Windows app stores transactions in local SQLite and images in local folders, with daily backups. Online HTML preview uses browser storage. Save an external copy of your JSON backup regularly.</p><div class="links">${btn('⬇ Download Full JSON Backup','backup()','primary')}${btn('📁 Data Folders','showDataLocation()')}${btn('💾 Create SQLite Backup','makeNativeBackup()')}${btn('🔎 Storage Details (No Deletion)','storageDetails()')}<label class="btn">⬆ Restore JSON<input type="file" accept=".json,application/json" hidden onchange="restore(this)"></label></div></div><div class="panel"><h2>Sync & Share</h2><p class="note">Automatic cloud sync is not available in the offline HTML version. Use exported backups to move your data between computers; avoid editing both copies independently.</p></div>`}let marketingTab='hub';function showMarketingPoster(){marketingTab='poster';go('marketing')}function showMarketingHub(){marketingTab='hub';go('marketing')}function marketingView(){const c=co();if(!c)return '<div class="panel">Please add a company first.</div>';if(marketingTab==='poster')return `<div class="panel"><button class="btn" onclick="showMarketingHub()">← Digital Marketing Hub</button><h2 style="margin-top:13px">Digital Marketing → AI Poster Creator</h2></div>`+posterView();const links=[['Facebook',c.facebook,'https://www.facebook.com/'],['Instagram',c.instagram,'https://www.instagram.com/'],['YouTube',c.youtube,'https://www.youtube.com/'],['Google Business',c.googleBusiness,'https://business.google.com/'],['WhatsApp Web','https://web.whatsapp.com/','https://web.whatsapp.com/']];return `<div class="panel"><h2>Digital Marketing — Company Social Hub</h2><div style="margin:16px 0"><button class="btn primary" onclick="showMarketingPoster()">✨ AI Poster Creator — Open Studio</button></div><p>Configure your shop URLs in Settings. Online access needs Internet.</p><div class="links">${links.map(([label,custom,fallback])=>{const url=custom||fallback;return /^https:\/\//i.test(url)?`<a class="btn" href="${E(url)}" rel="noopener" target="_blank">${E(label)}</a>`:''}).join('')}</div></div><div class="panel"><h2>Share Invoices</h2><p>Open a customer's invoice in Sale Invoices → Share Bill. Save the PNG/PDF, then choose the recipient in WhatsApp Web and attach the file manually. Company review message is copied to clipboard if available.</p></div>`}

function saveSettings(){if(!requireOwner())return;const c=co();for(const [k,n] of [['name','cname'],['gst','cgst'],['phone','cphone'],['whatsapp','cwhatsapp'],['email','cemail'],['address','caddress'],['invoicePrefix','cinvoice'],['footer','cfooter'],['bank','cbank'],['upi','cupi'],['googleReviewUrl','creview'],['reviewMessage','creviewText'],['facebook','cfacebook'],['instagram','cinstagram'],['youtube','cyoutube'],['googleBusiness','cgoogle']])c[k]=q(`[name=${n}]`)?.value.trim()||'';const review=q('[name=reviewEnabled]').value;c.reviewEnabled=review==='no'?false:true;c.lowStockLimit=Math.max(0,Number(q('[name=clow]').value)||0);c.invoiceTheme=q('[name=template]').value;db.settings.pointsPer100=Math.max(0,Number(q('[name=points]').value)||0);db.settings.theme=q('[name=theme]').value;if(!save())return;render();toast('Company settings saved')}


async function deleteCurrentCompany(){if(!requireOwner())return;
 const c=co();if(!c)return;
 const counts={invoices:db.sales.filter(x=>x.company===c.id).length,products:db.items.filter(x=>x.company===c.id).length,clients:db.clients.filter(x=>x.company===c.id).length};
 const message='PERMANENT DELETE: '+c.name+'\\n\\nThis deletes '+counts.invoices+' invoices, '+counts.products+' products, '+counts.clients+' clients, and all other company-linked records.\\n\\nFirst download your JSON backup. Continue?';
 if(!await saConfirm(message.replaceAll('\\n','\n')))return;
 backup();
 const typed=await saPrompt('Final confirmation: type the EXACT company name to delete this company and its records:\n'+c.name);
 if(typed===null)return;
 if(typed!==c.name)return alert('Company name does not match. Nothing deleted.');
 const companyId=c.id;
 for(const field of ['items','clients','sales','expenses','purchases','payments','attendance','staff','stockAdjustments']){
   if(Array.isArray(db[field]))db[field]=db[field].filter(x=>x.company!==companyId);
 }
 db.companies=db.companies.filter(x=>x.id!==companyId);db.users=db.users.filter(x=>x.role==='owner'||x.company!==companyId);
 company=db.companies[0]?.id||null;
 setCompanyChoice(company);
 cart=[];billDraft={name:'',phone:'',clientId:'',mode:'Cash',paid:null,discountPercent:'0',discountRupees:'0'};
 page='home';if(!save())return;render();toast('Company deleted');
}

 <p class="hint">A ChatGPT conversation URL opens that conversation, but browsers do not allow SAARATHI to automatically insert or send a message into it. Prompt is copied manually.</p></div></div>`;
}
function posterValue(id){return document.getElementById(id)?.value.trim()||''}
function posterGeneratePrompt(){
 const item=posterValue('posterItem');if(!item){alert('Item / Product Name is required.');document.getElementById('posterItem')?.focus();return}
 const c=co();const optional=[['Flavour / variant','posterFlavour'],['Price / offer price','posterPrice'],['Headline / tagline','posterHeadline'],['Offer description','posterOffer'],['Preferred colours','posterColors'],['Background concept','posterBackground'],['Additional instructions','posterNotes']];
 const lines=[`Create a professionally designed, high-quality advertisement POSTER IMAGE for the business below.`,
 `Product / Item: ${item}`,`Poster type: ${posterValue('posterType')}`,`Platform: ${posterValue('posterPlatform')}`,`Size / aspect ratio: ${posterValue('posterRatio')}`,`Language for the written content: ${posterValue('posterLang')}`,`Design style: ${posterValue('posterStyle')}`];
 for(const [label,id] of optional){const v=posterValue(id);if(v)lines.push(`${label}: ${v}`)}
 const companyName=posterValue('posterCompany'),phone=posterValue('posterPhone'),address=posterValue('posterAddress');
 if(companyName)lines.push(`Business / brand name: ${companyName}`);
 if(phone)lines.push(`Contact number to print: ${phone}`);
 if(address)lines.push(`Address to print: ${address}`);
 if(posterUploadLogoData||c?.logo)lines.push('I will manually attach the actual business logo image to this ChatGPT conversation. Use that attached logo exactly as provided; do not invent or redraw it. If no image is actually attached, omit the logo.');
 lines.push('Create an attractive and professional commercial layout. Use excellent typography, visual hierarchy, balanced spacing and a print-quality look. Keep all supplied text, spelling, contact details and prices exact. Do not invent business claims, prices, offers, addresses or logos. Ensure Tamil text (if selected) is legible and correctly spelled.');
 const result=lines.join('\n');document.getElementById('posterPrompt').value=result;posterGeneratedPrompt=result;toast('Poster prompt generated');
}
function posterClearForm(){posterGeneratedPrompt='';posterDraftCompany=null;posterUploadLogoData=null;posterUploadLogoName='';go('poster')}
async function posterCopyPrompt(){const textValue=posterValue('posterPrompt');if(!textValue){alert('Generate or type a prompt first.');return}posterGeneratedPrompt=textValue;
 try{await navigator.clipboard.writeText(textValue);toast('Prompt copied — paste into ChatGPT')}catch(e){const ta=document.getElementById('posterPrompt');ta.focus();ta.select();try{document.execCommand('copy');toast('Prompt selected / copied')}catch{alert('Please select the prompt and copy manually.')}}
}
function posterSaveChatURL(){const link=posterValue('posterChatUrl');if(link&&!posterValidChatURL(link)){alert('Please use your original ChatGPT conversation URL from the address bar (chatgpt.com/c/...). Do not use Share > Copy Link (/share/).');return false}if(!co())return false;co().aiPosterChatUrl=link;save();const a=document.getElementById('posterSavedOpenLink');if(a)a.href=link||'https://chatgpt.com/';toast('ChatGPT conversation link saved');return true}
function posterPrepareChatLink(event){if(!posterSaveChatURL()){event.preventDefault();return false}const a=event.currentTarget;if(a){a.href=co()?.aiPosterChatUrl||'https://chatgpt.com/';a.target='_blank';a.rel='noopener noreferrer'}return true}
async function posterCopyChatURL(){const textValue=posterValue('posterChatUrl')||co()?.aiPosterChatUrl||'https://chatgpt.com/';if(!posterValidChatURL(textValue)){alert('Use your original conversation /c/ URL instead of a /share/ link.');return}try{await navigator.clipboard.writeText(textValue);toast('ChatGPT link copied — paste into browser address bar')}catch(e){const input=document.getElementById('posterChatUrl');if(input){input.value=textValue;input.focus();input.select();try{document.execCommand('copy');toast('Link copied')}catch{alert('Copy the selected ChatGPT link manually.')}}else{await saPrompt('Copy this ChatGPT link:',textValue)}}}
function posterOpenChatGPT(){if(!posterSaveChatURL())return;const link=co().aiPosterChatUrl||'https://chatgpt.com/';window.open(link,'_blank','noopener,noreferrer')}
function posterOpenNewChat(){window.open('https://chatgpt.com/','_blank','noopener,noreferrer')}
function posterChooseLogo(input){
 const file=input.files?.[0];if(!file)return;
 if(!['image/png','image/jpeg','image/webp'].includes(file.type)){alert('Select a PNG, JPG or WebP logo.');input.value='';return}
 if(file.size>1024*1024){alert('Logo must be 1 MB or smaller.');input.value='';return}
 const reader=new FileReader();
 reader.onload=()=>{posterUploadLogoData=String(reader.result||'');posterUploadLogoName=file.name;
  const img=document.getElementById('posterLogoPreview'),empty=document.getElementById('posterLogoPlaceholder');
  if(img){img.src=posterUploadLogoData;img.style.display='block'}if(empty)empty.style.display='none';
  const status=document.getElementById('posterLogoStatus');if(status)status.textContent='Attached: '+file.name+' · Poster only · not saved in company data';
  toast('Logo selected. Download it and attach in ChatGPT after opening the conversation.');
 };
 reader.onerror=()=>alert('Could not read this logo file.');reader.readAsDataURL(file);
}
function posterResetLogo(){posterUploadLogoData=null;posterUploadLogoName='';const c=co(),img=document.getElementById('posterLogoPreview'),empty=document.getElementById('posterLogoPlaceholder');if(img){img.src=c?.logo||'';img.style.display=c?.logo?'block':'none'}if(empty)empty.style.display=c?.logo?'none':'grid';const status=document.getElementById('posterLogoStatus');if(status)status.textContent=c?.logo?'Company logo selected · Max 1 MB':'No logo selected (optional)';const inp=document.getElementById('posterLogoUpload');if(inp)inp.value=''}
function posterDownloadLogo(){const c=co(),src=posterUploadLogoData||c?.logo;if(!src){alert('Attach a logo using Upload Logo or save Company Logo in Settings first.');return}const a=document.createElement('a');a.href=src;const suffix=posterUploadLogoData?(posterUploadLogoName.split('.').pop().toLowerCase()||'png'):(src.startsWith('data:image/jpeg')?'jpg':src.startsWith('data:image/webp')?'webp':'png');a.download='SAARATHI_'+(c?.name||'company').replace(/[^a-z0-9_-]+/gi,'_')+'_poster_logo.'+suffix;document.body.appendChild(a);a.click();a.remove()}



render();

/* SAARATHI v3.1.6 – local Excel/CSV inventory bulk import. Only company items; no cloud upload. */
let saarathiBulkPending=[];
function downloadBulkTemplate(){
 const text='Item Name,Category,Selling Price,Purchase Cost,Opening Stock\r\nSample Product,General,100,70,10\r\n';
 const blob=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SAARATHI_Item_Import_Template.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);
}
function closeBulkImport(){document.getElementById('bulkImportOverlay')?.remove();saarathiBulkPending=[]}
function openBulkImport(){
 if(!requireOwner())return;
 closeBulkImport();
 const overlay=document.createElement('div');overlay.className='modalcover';overlay.id='bulkImportOverlay';
 overlay.innerHTML=`<div class="modal" style="max-width:800px;width:95vw;max-height:90vh;overflow:auto"><div class="bar"><h2>⬆ Bulk Import — Items & Stock</h2><button type="button" class="btn" onclick="closeBulkImport()">✕</button></div>
 <p class="note">Current company only. Supported: Excel .xlsx and CSV. Import up to 5,000 items. Existing items are never automatically overwritten.</p>
 <div class="flex" style="gap:12px;align-items:end;flex-wrap:wrap"><div class="field" style="flex:1;min-width:240px"><label>Select Excel / CSV file</label><input id="bulkInputFile" type="file" accept=".xlsx,.csv"></div><button class="btn" type="button" onclick="downloadBulkTemplate()">⬇ CSV Template</button><button class="btn primary" type="button" onclick="previewBulkImport()">Preview</button></div>
 <div id="bulkImportResult" style="margin-top:14px"></div><div class="flex" style="justify-content:flex-end;margin-top:16px"><button class="btn" type="button" onclick="closeBulkImport()">Cancel</button><button id="bulkConfirmButton" type="button" class="btn primary" disabled onclick="confirmBulkImport()">Import Items</button></div></div>`;
 document.body.appendChild(overlay);
}
async function previewBulkImport(){
 const input=document.getElementById('bulkInputFile'),out=document.getElementById('bulkImportResult');
 if(!input||!out)return;const file=input.files?.[0];if(!file){alert('Select .xlsx or .csv file');return}
 if(file.size>12*1024*1024){alert('File exceeds 12 MB');return}
 out.textContent='Reading file…';saarathiBulkPending=[];document.getElementById('bulkConfirmButton').disabled=true;
 try{
  const bytes=Array.from(new Uint8Array(await file.arrayBuffer()));
  let result;
  if(window.saarathiDesktop?.parseBulkFile)result=await window.saarathiDesktop.parseBulkFile(bytes,file.name);
  else if(file.name.toLowerCase().endsWith('.csv'))result={ok:true,rows:parseBulkCsv(await file.text())};
  else throw Error('Excel .xlsx import requires the installed Windows app. For browser preview, use CSV.');
  if(!result?.ok)throw Error(result?.error||'Unable to parse file');
  const rows=result.rows||[];if(rows.length<2)throw Error('File needs a header and item rows');
  const norm=h=>String(h||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const header=rows[0].map(norm);
  const match=(names)=>header.findIndex(h=>names.includes(h));
  const iName=match(['itemname','productname','name','item']),iCat=match(['category','group']),iPrice=match(['sellingprice','saleprice','price','mrp']),iCost=match(['purchasecost','costprice','cost','buyprice']),iStock=match(['openingstock','stock','qty','quantity']);
  if(iName<0||iCat<0)throw Error('Headers Item Name and Category are required. Download the CSV Template.');
  const valid=[],errors=[],duplicates=[],seen=new Set();
  const existing=new Set(mine(db.items).map(i=>normCategory(i.name)+'|'+normCategory(i.category)));
  for(let ri=1;ri<rows.length;ri++){
   const row=rows[ri],name=String(row[iName]||'').trim(),category=String(row[iCat]||'').trim();
   if(!name&&!category)continue;
   const num=(idx)=>{let raw=idx<0?'0':String(row[idx]||'0').trim().replace(/,/g,'');return raw===''?0:Number(raw)};
   const price=num(iPrice),cost=num(iCost),stock=num(iStock),key=normCategory(name)+'|'+normCategory(category);
   if(!name||!category||![price,cost,stock].every(Number.isFinite)||[price,cost,stock].some(n=>n<0)){errors.push('Row '+(ri+1)+': invalid name, category, price, cost, or stock');continue}
   if(existing.has(key)||seen.has(key)){duplicates.push('Row '+(ri+1)+': '+name);continue}
   seen.add(key);valid.push({name,category,price,cost,stock});
  }
  saarathiBulkPending=valid;
  out.innerHTML=`<div class="panel"><b>Preview:</b> ${valid.length} new items • ${duplicates.length} skipped duplicates • ${errors.length} invalid rows<br><small class="muted">No changes saved yet. Click Import Items to confirm.</small></div>`+
   (errors.length?`<details><summary>Errors (${errors.length})</summary><pre style="white-space:pre-wrap">${E(errors.slice(0,30).join('\n'))}</pre></details>`:'')+
   (duplicates.length?`<details><summary>Duplicate items (${duplicates.length}) — skipped</summary><pre style="white-space:pre-wrap">${E(duplicates.slice(0,30).join('\n'))}</pre></details>`:'')+
   `<div class="table-wrap"><table><tr><th>Item</th><th>Category</th><th>Price</th><th>Cost</th><th>Opening Stock</th></tr>${valid.slice(0,25).map(x=>`<tr><td>${E(x.name)}</td><td>${E(x.category)}</td><td>${x.price}</td><td>${x.cost}</td><td>${x.stock}</td></tr>`).join('')}</table></div>`;
  document.getElementById('bulkConfirmButton').disabled=!valid.length;
 }catch(err){saarathiBulkPending=[];out.textContent=String(err.message||err)}
}
function parseBulkCsv(text){
 const rows=[];let cells=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}
  else if(ch===','&&!quoted){cells.push(cell);cell=''}
  else if((ch==='\r'||ch==='\n')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;cells.push(cell);if(cells.some(v=>v.trim()))rows.push(cells);cells=[];cell=''}
  else cell+=ch;
 }
 if(quoted)throw Error('Unclosed CSV quote');cells.push(cell);if(cells.some(v=>v.trim()))rows.push(cells);
 if(rows.length>5001)throw Error('Maximum 5,000 rows per import');if(rows[0]?.[0])rows[0][0]=rows[0][0].replace(/^\uFEFF/,'');return rows;
}
async function confirmBulkImport(){
 if(!requireOwner()||!saarathiBulkPending.length)return;
 if(!await saConfirm('Import '+saarathiBulkPending.length+' items into the selected company?'))return;
 const batch=saarathiBulkPending.slice(),snapshot=db.items.slice(),previousSeq=db.seq;
 try{
  for(const x of batch)db.items.push({id:id(),company,name:x.name,category:canonicalCategory(x.category),price:x.price,cost:x.cost,stock:x.stock,image:''});
  const saved=save();
  if(saved===false)throw Error('Could not save imported items');
  closeBulkImport();toast(batch.length+' items imported');render();
 }catch(err){db.items=snapshot;db.seq=previousSeq;alert('Import failed: '+(err.message||err));}
}
